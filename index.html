<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaffeekasse – MS Hörsching</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2723;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:28px 18px 60px}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.logo{font-size:38px}.muted{color:#6c756f}.card{background:#fff;border:1px solid #dde2de;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0000000a;margin-bottom:16px}.login{max-width:440px;margin:10vh auto}.field{display:grid;gap:7px;margin:14px 0}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #cfd6d1;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:650;background:#244b3a;color:white}button.secondary{background:#e8ede9;color:#244b3a}button.danger{background:#7d302f}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.month{font-size:24px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:#f5f7f5;border-radius:14px;padding:16px}.stat b{font-size:24px;display:block;margin-top:3px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e6e9e7}th:nth-child(n+2),td:nth-child(n+2){text-align:right}.total td{font-weight:750;border-top:2px solid #bcc6bf}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8ede9;font-size:13px}.status.done{background:#dcecdf;color:#205b32}.error{color:#a12b28;margin-top:10px}.hidden{display:none!important}@media(max-width:620px){.stats{grid-template-columns:1fr}.month{font-size:20px}.card{padding:15px}th,td{padding:10px 5px}.hide-mobile{display:none}}
</style>
</head><body><div class="wrap">
<section id="login" class="card login"><div class="logo">☕</div><h1>Kaffeekasse</h1><p class="muted">MS Hörsching · Verwaltung</p><div class="field"><label>E-Mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">Anmelden</button><div id="loginError" class="error"></div></section>
<section id="app" class="hidden"><header><div class="logo">☕</div><div><h1 style="margin:0">Kaffeekasse</h1><div class="muted">MS Hörsching</div></div><button id="logoutBtn" class="secondary" style="margin-left:auto">Abmelden</button></header>
<div class="card"><div class="row between"><button id="prev" class="secondary">‹</button><div id="monthTitle" class="month"></div><button id="next" class="secondary">›</button></div><div class="stats"><div class="stat"><span class="muted">Personen</span><b id="peopleCount">–</b></div><div class="stat"><span class="muted">Kaffee</span><b id="coffeeTotal">–</b></div><div class="stat"><span class="muted">Gesamt</span><b id="moneyTotal">–</b></div></div><div class="row between"><span id="billingStatus" class="status">nicht abgerechnet</span><div class="row"><button id="pdfBtn" class="secondary">PDF-Abrechnung</button><button id="settleBtn">Monat abrechnen</button></div></div></div>
<div class="card"><table><thead><tr><th>Kürzel</th><th>Kaffee</th><th class="hide-mobile">Einzelpreis</th><th>Betrag</th></tr></thead><tbody id="rows"></tbody><tfoot id="tfoot"></tfoot></table><div id="dataError" class="error"></div></div>
</section></div>
<script>
const SUPABASE_URL='https://rsulxnggdfngcvffaxvp.supabase.co';
const SUPABASE_KEY='sb_publishable_XSInViWdnmHFbR7cBsBwGA_jr7h9YGp';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id); let cursor=new Date(); cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1); let currentRows=[]; let currentBilling=null;
const months=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const eur=n=>Number(n||0).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
async function boot(){const {data:{session}}=await sb.auth.getSession(); showSession(session); sb.auth.onAuthStateChange((_e,s)=>showSession(s));}
function showSession(s){$('login').classList.toggle('hidden',!!s);$('app').classList.toggle('hidden',!s);if(s)loadMonth();}
$('loginBtn').onclick=async()=>{ $('loginError').textContent=''; const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error)$('loginError').textContent=error.message; };
$('logoutBtn').onclick=()=>sb.auth.signOut();
$('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);loadMonth()}; $('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);loadMonth()};
async function loadMonth(){const y=cursor.getFullYear(),m=cursor.getMonth()+1;$('monthTitle').textContent=`${months[m-1]} ${y}`;$('dataError').textContent='';
 const [{data:rows,error:e1},{data:bill,error:e2}]=await Promise.all([sb.from('kaffee_abrechnung').select('*').eq('jahr',y).eq('monat',m).order('kuerzel'),sb.from('abrechnungen').select('*').eq('jahr',y).eq('monat',m).maybeSingle()]);
 if(e1){$('dataError').textContent=e1.message;return} if(e2){$('dataError').textContent=e2.message;return} currentRows=rows||[];currentBilling=bill;render();}
function render(){let coffees=0,money=0;$('rows').innerHTML=currentRows.map(r=>{coffees+=Number(r.kaffee);money+=Number(r.betrag);return `<tr><td><b>${esc(r.kuerzel)}</b></td><td>${r.kaffee}</td><td class="hide-mobile">${eur(r.einzelpreis)}</td><td>${eur(r.betrag)}</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">Noch keine Buchungen in diesem Monat.</td></tr>';
 $('peopleCount').textContent=currentRows.length;$('coffeeTotal').textContent=coffees;$('moneyTotal').textContent=eur(money);$('tfoot').innerHTML=`<tr class="total"><td>Gesamt</td><td>${coffees}</td><td class="hide-mobile"></td><td>${eur(money)}</td></tr>`;
 $('billingStatus').textContent=currentBilling?`✓ abgerechnet am ${new Date(currentBilling.abgerechnet_am).toLocaleDateString('de-AT')}`:'nicht abgerechnet';$('billingStatus').classList.toggle('done',!!currentBilling);$('settleBtn').textContent=currentBilling?'Abrechnung zurücknehmen':'Monat abrechnen';$('settleBtn').className=currentBilling?'danger':'';}
$('settleBtn').onclick=async()=>{const y=cursor.getFullYear(),m=cursor.getMonth()+1;if(currentBilling){if(!confirm('Abrechnungsstatus für diesen Monat wirklich zurücknehmen?'))return;const {error}=await sb.from('abrechnungen').delete().eq('id',currentBilling.id);if(error)return alert(error.message)}else{if(!confirm(`${months[m-1]} ${y} als abgerechnet markieren?`))return;const {error}=await sb.from('abrechnungen').insert({jahr:y,monat:m});if(error)return alert(error.message)}loadMonth()};
$('pdfBtn').onclick=()=>{const {jsPDF}=window.jspdf;const doc=new jsPDF();const y=cursor.getFullYear(),m=cursor.getMonth()+1;let coffees=currentRows.reduce((s,r)=>s+Number(r.kaffee),0),money=currentRows.reduce((s,r)=>s+Number(r.betrag),0);doc.setFontSize(18);doc.text('Kaffeekasse – MS Hörsching',14,18);doc.setFontSize(13);doc.text(`Monatsabrechnung ${months[m-1]} ${y}`,14,27);doc.setFontSize(9);doc.text(`Erstellt am ${new Date().toLocaleDateString('de-AT')}`,14,34);doc.autoTable({startY:42,head:[['Kürzel','Kaffee','Einzelpreis','Betrag']],body:currentRows.map(r=>[r.kuerzel,String(r.kaffee),eur(r.einzelpreis),eur(r.betrag)]),foot:[['Gesamt',String(coffees),'',eur(money)]],styles:{fontSize:10},headStyles:{fillColor:[55,75,65]},footStyles:{fillColor:[235,239,236],textColor:[20,30,25]}});let fy=doc.lastAutoTable.finalY+10;doc.setFontSize(10);doc.text(currentBilling?`Status: abgerechnet am ${new Date(currentBilling.abgerechnet_am).toLocaleDateString('de-AT')}`:'Status: noch nicht als abgerechnet markiert',14,fy);doc.save(`Kaffeekasse_${y}-${String(m).padStart(2,'0')}.pdf`)};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} boot();
</script></body></html>
